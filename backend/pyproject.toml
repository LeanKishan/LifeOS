[project]
name = "lifeos-backend"
version = "0.1.0"
description = "LifeOS API - FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-dateutil>=2.9",
    "redis>=5.2",
    "fakeredis>=2.26",
    "celery>=5.4",
    "reportlab>=4.2",
    "anthropic>=0.49",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.12",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil>=2.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated migration scripts are verified by running them in CI, not by style.
extend-exclude = ["app/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be call expressions in defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/migrations/"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "reportlab.*", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery's @task decorator is untyped; don't let that infect the task bodies.
module = ["app.worker.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
