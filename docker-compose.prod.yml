name: lifeos-prod

# Production-parity stack: the same images and process model as the ECS
# deployment (see infra/), on one host. The `gateway` service plays the part of
# the ALB — /api/* to the backend, everything else to the static frontend.
#
#   JWT_SECRET=$(openssl rand -hex 32) docker compose -f docker-compose.prod.yml up --build

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lifeos}:${POSTGRES_PASSWORD:-lifeos}@db:5432/${POSTGRES_DB:-lifeos}
  REDIS_URL: redis://redis:6379/0
  CELERY_EAGER: "false"
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  ENVIRONMENT: production
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a 32+ char secret}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeos}
      POSTGRES_DB: ${POSTGRES_DB:-lifeos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifeos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: bring the schema to head, then exit. In AWS this is a standalone
  # ECS RunTask in the release pipeline, not part of container start.
  migrate:
    build:
      context: ./backend
      target: prod
    command: ["migrate"]
    environment: *backend-env
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    command: ["serve"]
    environment: *backend-env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    command: ["worker"]
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    command: ["beat"]
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/compose/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
