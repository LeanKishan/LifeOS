# Serves the built SPA. It does NOT proxy /api — the ALB (prod) and the compose
# `gateway` service route /api/* straight to the backend, so this container only
# ever sees asset + document requests.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ALB target-group health check.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints asset filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else falls back to the SPA shell for client-side routing.
    location / {
        try_files $uri /index.html;
    }

    # index.html itself must never be cached, or a deploy won't be picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
