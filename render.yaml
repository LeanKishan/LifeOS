# Render Blueprint — one self-contained web service (the FastAPI backend also
# serves the built React SPA), plus a managed Postgres and Redis.
#
#   Render dashboard -> New -> Blueprint -> pick the LeanKishan/LifeOS repo -> Apply.
#
# Nothing here hardcodes a hostname: the app serves its own frontend, so whatever
# URL Render assigns just works. First build ~6 min (SPA + Docker + migrations).
# Optional: set ANTHROPIC_API_KEY on the web service to enable /coach.
#
# Free tier: the web service sleeps after 15 min idle (~50s cold start) and the
# free Postgres is wiped after 30 days. Bump each `plan:` to `starter` for an
# always-on, persistent deployment.

databases:
  - name: lifeos-db
    plan: free
    databaseName: lifeos
    user: lifeos
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: lifeos-cache
    plan: free
    region: oregon
    ipAllowList: [] # reachable only from Render services
    maxmemoryPolicy: noeviction

  - type: web
    name: lifeos
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: web # entrypoint: alembic upgrade head, then gunicorn
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lifeos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lifeos-cache
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CELERY_EAGER
        value: "true" # no separate worker on the free tier
      - key: ALLOW_EAGER_CELERY
        value: "true"
      - key: WS_FANOUT_ENABLED
        value: "false" # single instance
      - key: LOG_JSON
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false # set in the dashboard to enable the assistant
